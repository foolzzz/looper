[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "looper"
version = "2.14.24"
description = "A self-hosted three-tier multi-agent system that runs Claude Code on your tasks, with a real-time web dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT"]
authors = [{ name = "Looper contributors" }, { name = "LoopX contributors" }]
dependencies = [
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "openai>=3.37,<4",
  "python-telegram-bot>=22,<23",
  "websockets>=15,<16",
]

[project.urls]
Homepage = "https://github.com/foolzzz/looper"
Documentation = "https://github.com/foolzzz/looper/tree/main/docs"
Repository = "https://github.com/foolzzz/looper"
Issues = "https://github.com/foolzzz/looper/issues"
Changelog = "https://github.com/foolzzz/looper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3,<4",
  "ruff>=0.12,<0.16",
]

[project.scripts]
looper = "looper.cli:main"
loopercli = "looper.loopercli:main"

[tool.setuptools.packages.find]
include = ["looper*"]

[tool.setuptools.package-data]
"looper" = ["web/dashboard/*", "web/dashboard/assets/*", "skill/looper-skill/SKILL.md"]
"looper.db" = ["*.sql"]
"looper.agents.runtimes.api" = ["THIRD_PARTY_NOTICES.txt"]
"looper.agents.runtimes" = ["*.mjs", "pi_extension/looper.ts"]
"looper.agents.runtimes.runner" = ["pi_runner/package.json", "pi_runner/src/*.ts", "common/package.json", "common/*.ts", "dsh_runner/package.json", "dsh_runner/src/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "installed: requires an installed runtime CLI or browser; run by the nightly workflow",
    "provenance: clones an old revision to prove where a pinned fixture came from (slow; select with -m provenance)",
]

[tool.coverage.run]
source = ["looper"]
relative_files = true
