[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "looper"
version = "2.6.0"
description = "A self-hosted three-tier multi-agent system that runs Claude Code on your tasks, with a real-time web dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT"]
authors = [{ name = "Looper contributors" }, { name = "LoopX contributors" }]
dependencies = [
  "asyncpg>=0.29,<1",
  "python-telegram-bot>=22,<23",
]

[project.urls]
Homepage = "https://github.com/foolzzz/looper"
Documentation = "https://github.com/foolzzz/looper/tree/main/docs"
Repository = "https://github.com/foolzzz/looper"
Issues = "https://github.com/foolzzz/looper/issues"
Changelog = "https://github.com/foolzzz/looper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3,<4",
  "ruff>=0.12,<0.16",
]

[project.scripts]
looper = "looper.cli:main"
# The command's name before the rename, kept for one release: a deprecation note, then looper.
loopx = "looper.cli:legacy_main"

[tool.setuptools.packages.find]
include = ["looper*"]

[tool.setuptools.package-data]
"looper" = ["web/dashboard/*", "web/dashboard/assets/*"]
"looper.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["looper"]
relative_files = true
