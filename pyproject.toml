[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx"
version = "2.5.0"
description = "A lightweight Loop Engineering control plane for long-running agent goals."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT"]
authors = [{ name = "LoopX contributors" }]
dependencies = [
  "asyncpg>=0.29,<1",
  "python-telegram-bot>=22,<23",
]

[project.urls]
Homepage = "https://github.com/foolzzz/looper"
Documentation = "https://github.com/foolzzz/looper/tree/main/docs"
Repository = "https://github.com/foolzzz/looper"
Issues = "https://github.com/foolzzz/looper/issues"
Changelog = "https://github.com/foolzzz/looper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3,<4",
  "ruff>=0.12,<0.16",
]

[project.scripts]
loopx = "loopx.cli:main"

[tool.setuptools.packages.find]
include = ["loopx*"]

[tool.setuptools.package-data]
"loopx" = ["web/dashboard/*", "web/dashboard/assets/*"]
"loopx.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["loopx"]
relative_files = true
