name: Python Tests

# The agent system's tests (pyproject.toml: testpaths = ["tests"]), with the
# PostgreSQL ones run against the service database; and the dashboard's tests
# (web/, npm test).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect docs-only and dashboard changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          web=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            web=false
            # Disable rename detection so moving code into docs still runs tests.
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            if [[ -s "$RUNNER_TEMP/changed-paths" ]]; then
              docs_only=true
              while IFS= read -r -d '' path; do
                case "$path" in
                  docs/*|*.md) ;;
                  *) docs_only=false ;;
                esac
                # Include staging and source-fingerprint inputs outside web/.
                case "$path" in
                  web/*|scripts/stage-dashboard.sh|looper/components.py|looper/components.toml|.github/workflows/python-tests.yml|.npmrc|.gitignore) web=true ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  agent-system:
    name: Agent system tests (shard ${{ matrix.shard }}/6)
    needs: changes
    # Keep the runner's PostgreSQL 16 client package available alongside the service.
    runs-on: ubuntu-24.04
    # Include service setup and dashboard staging, plus headroom for runner variance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOOPER_TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - name: Increase PostgreSQL lock capacity
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Concurrent schema creation/drop locks every table and index until commit.
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in {1..30}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d postgres; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc 'SHOW max_locks_per_transaction')" = 1024

      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
        with:
          # Bridge tests execute the pinned release from source history.
          fetch-depth: 0

      - name: Fetch the required database bridge source
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          git fetch --no-tags origin refs/tags/v2.13.165:refs/tags/v2.13.165
          test "$(git rev-parse v2.13.165^{commit})" = f2935092d44c4707d92d4b60c32a334a934d4db9
          git cat-file -e f2935092d44c4707d92d4b60c32a334a934d4db9:looper/db/schema.sql

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: "24"

      - name: Install uv
        if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip install uv

      - name: Install PostgreSQL clients matching the service
        if: needs.changes.outputs.docs_only != 'true'
        # Newer pg_restore can emit settings unsupported by the PostgreSQL 16 server.
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      # Browser and serve tests require real staged assets, even on backend-only PRs.
      - name: Build the dashboard
        if: needs.changes.outputs.docs_only != 'true'
        run: scripts/stage-dashboard.sh

      - name: Allow unprivileged user namespaces
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Ubuntu 24.04's AppArmor sysctl hides these namespaces. Other images have no such key.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || test ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Run the tests
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run --extra test python -m pytest -q -n auto -rs --durations=25 -m "not installed and not provenance"

      - name: Report docs-only success
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only pull request; test steps skipped."

  bridge-schema-pg18:
    name: PostgreSQL 18 bridge upgrades and restarts
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Increase PostgreSQL lock capacity
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Concurrent schema creation/drop locks every table and index until commit.
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in {1..30}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d postgres; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc 'SHOW max_locks_per_transaction')" = 1024

      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
      - name: Install uv
        if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip install uv
      - name: Verify native PostgreSQL 18 catalog, bridge upgrades and restarts
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run --extra test python -m pytest -q -n 2 tests/test_bridge_schema_db.py

      - name: Report docs-only success
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only pull request; test steps skipped."

  provenance:
    # Proofs that pinned fixtures came from an old revision (pytest -m provenance). The shards exclude
    # them; they run on main pushes, dispatch canaries and release pull requests.
    name: Pinned-baseline provenance tests
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Increase PostgreSQL lock capacity
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # Concurrent schema creation/drop locks every table and index until commit.
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in {1..30}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d postgres; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc 'SHOW max_locks_per_transaction')" = 1024

      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
      - name: Install uv
        if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip install uv
      - name: Run the provenance tests
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run --extra test python -m pytest -q -n 2 -rs -m provenance

      - name: Report docs-only success
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only pull request; test steps skipped."

  agent-system-result:
    name: Agent system tests
    needs: [changes, agent-system, bridge-schema-pg18, provenance, dashboard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require shards and any enabled checks to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARDS_RESULT: ${{ needs.agent-system.result }}
          PG18_RESULT: ${{ needs.bridge-schema-pg18.result }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
        run: |
          echo "Agent system shards: $SHARDS_RESULT"
          test "$CHANGES_RESULT" = success
          test "$SHARDS_RESULT" = success
          # Optional jobs may be skipped by their job conditions, but never fail silently.
          for result in "$PG18_RESULT" "$PROVENANCE_RESULT" "$DASHBOARD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Enabled check did not succeed: $result"; exit 1 ;;
            esac
          done

  dashboard:
    name: Dashboard tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.web == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: "24"

      - name: Run the tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci && npx tsc -b && npm test

      - name: Report docs-only success
        if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Docs-only pull request; test steps skipped."
