name: Python Tests

# The agent system's tests (pyproject.toml: testpaths = ["tests"]), with the
# PostgreSQL ones run against the service database; and the dashboard's tests
# (web/, npm test).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-system:
    name: Agent system tests (shard ${{ matrix.shard }}/4)
    # Keep the runner's PostgreSQL 16 client package available alongside the service.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOOPER_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7
        with:
          # Recovery tests archive the supported v2.12 source.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install uv
        run: python -m pip install uv

      - name: Install PostgreSQL clients matching the service
        # Newer pg_restore can emit settings unsupported by the PostgreSQL 16 server.
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Build the dashboard
        run: scripts/stage-dashboard.sh

      - name: Run the tests
        run: uv run --extra test python -m pytest -q -n auto -rs --durations=25 -m "not installed and not provenance"

  agent-system-result:
    name: Agent system tests
    needs: agent-system
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.agent-system.result }}
        run: |
          echo "Agent system shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run the tests
        run: npm ci && npx tsc -b && npm test
