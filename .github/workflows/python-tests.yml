name: Python Tests

# The agent system's tests, with the PostgreSQL ones run against the service
# database. The upstream LoopX tests still in tests/ are not run: they are
# being removed, and some no longer import. Until then a new test file of the
# agent system must be added to the list below.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-system:
    name: Agent system tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Run the tests
        run: >-
          uv run --extra test python -m pytest -q -n auto -rs
          tests/test_agent_bus.py
          tests/test_agent_channels.py
          tests/test_agent_configs_db.py
          tests/test_agent_planner_worker.py
          tests/test_agent_settings.py
          tests/test_agent_settings_db.py
          tests/test_channel_configs_db.py
          tests/test_chat_targets.py
          tests/test_claude_cli.py
          tests/test_cli_entry.py
          tests/test_dashboard_static_dir.py
          tests/test_library.py
          tests/test_library_db.py
          tests/test_llm_records_db.py
          tests/test_manager_reply.py
          tests/test_planner_agent.py
          tests/test_planner_chat.py
          tests/test_planner_protocol.py
          tests/test_planner_supervise.py
          tests/test_project_documents_db.py
          tests/test_project_knowledge.py
          tests/test_projects_api.py
          tests/test_projects_db.py
          tests/test_request_guard.py
          tests/test_run_usage.py
          tests/test_system_prompt.py
          tests/test_task_router.py
          tests/test_task_work_dir.py
          tests/test_usage_api_db.py
