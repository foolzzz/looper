name: Go Tests

# The Go port (go/): vet and unit tests. PostgreSQL is not required for G0.
on:
  pull_request:
    branches:
      - loopgo-main

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
