name: Go Tests

# The Go port (go/): vet, unit tests, and the disposable-database parity suite.
on:
  pull_request:
    branches:
      - loopgo-main

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopgo_ci
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loopgo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed config export parity database
        working-directory: .
        run: |
          python -m pip install .
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:54329/postgres")
              try:
                  await conn.execute("CREATE DATABASE loopgo_config_export_ci")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
          # Drift is a regeneration that rewrites these files. Diffing against
          # HEAD also fails while an intended golden update is still uncommitted,
          # so compare with a copy of the worktree taken before the generator runs.
          snapshot="$(mktemp -d)"
          cp -a go/testdata/parity/config_export "$snapshot/config_export"
          python go/testdata/parity/make_config_export_goldens.py --db-url postgresql://postgres:postgres@127.0.0.1:54329/loopgo_config_export_ci
          diff -ru "$snapshot/config_export" go/testdata/parity/config_export

      - name: Test
        env:
          LOOPGO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/loopgo_ci
          LOOPGO_CONFIG_EXPORT_PARITY_URL: postgresql://postgres:postgres@127.0.0.1:54329/loopgo_config_export_ci
        run: go test ./...
