name: Go Tests

# The Go port (go/): vet, unit tests, and the disposable-database parity suite.
on:
  pull_request:
    branches:
      - loopgo-main

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopgo_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loopgo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          LOOPGO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/loopgo_ci
        run: go test ./...
