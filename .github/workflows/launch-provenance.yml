name: Launch fixture provenance

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/fixtures/model_launch_parity_v2_*.json"
      - "tests/model_launch_parity.py"
      - "tests/agent_launch_parity.py"
      - "tests/fake_claude.py"
      - "tests/test_model_launch_capture_db.py"
      - ".github/workflows/launch-provenance.yml"

permissions:
  contents: read

concurrency:
  group: launch-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify the four pinned legacy captures
        run: uv run --extra test python -m pytest -q -m provenance tests/test_model_launch_capture_db.py
