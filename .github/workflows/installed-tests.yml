name: Installed runtime tests

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOOPER_TEST_INSTALLED_DSH: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Python and browser dependencies
        run: |
          python -m pip install uv
          uv sync --extra test
          uv pip install playwright
          uv run --no-sync python -m playwright install --with-deps chromium
      - name: Install Pi's pinned compatibility target
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
      - name: Try the pinned DSH installation
        shell: bash
        run: |
          if ! npm install -g --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2; then
            echo '::warning::DSH 0.2.1-rc.2 could not be installed; DSH tests will report the gap as skips.'
            echo 'DSH 0.2.1-rc.2 could not be installed from npm.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run installed tests against local stand-ins
        run: timeout 1800 uv run --no-sync python -m pytest -q -n auto -m installed -rs --durations=25 --junitxml=installed-results.xml
      - name: Report unverified paths
        if: always()
        shell: python
        run: |
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          from collections import Counter
          report = pathlib.Path('installed-results.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n### Installed test gaps\n\n')
              if report.exists():
                  tree = ET.parse(report)
                  out.write(f"{len(list(tree.iter('testcase')))} tests; {len(list(tree.iter('failure')))} failures; {len(list(tree.iter('error')))} errors.\n\n")
                  gaps = Counter(node.get('message', 'unspecified skip') for node in tree.iter('skipped'))
                  if gaps:
                      for reason, count in sorted(gaps.items()):
                          out.write(f'- {count} skipped: {reason}\n')
                  else:
                      out.write('No installed tests skipped.\n')
              else:
                  out.write('No test report was produced; installed paths were not verified.\n')
              out.write('\nOptional real-model smoke combinations need explicit credentials and CLI installations. Claude/Codex/OMP/Grok and personal logins are not provisioned by this workflow.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-test-results
          path: installed-results.xml
