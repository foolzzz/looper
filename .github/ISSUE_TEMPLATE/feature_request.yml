name: Feature Request
description: Propose a concrete LoopX improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and the open todos in the development plan for this request.
          required: true
        - label: This request and its attachments contain no credentials or private material.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or unmet outcome
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposed-outcome
    attributes:
      label: Proposed outcome
      description: The smallest change that would solve it, and how you would know it works.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
