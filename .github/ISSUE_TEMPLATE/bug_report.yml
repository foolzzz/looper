name: Bug Report
description: Report reproducible incorrect or unexpected LoopX behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LoopX. Do not report an unpatched security vulnerability here; see [SECURITY.md](https://github.com/foolzzz/looper/blob/main/.github/SECURITY.md). Remove credentials, private data, raw agent transcripts, runtime state and local paths before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues for this behavior.
          required: true
        - label: This report and its attachments contain no credentials or private material.
          required: true

  - type: input
    id: version
    attributes:
      label: LoopX version or commit
      description: Output of `loopx version`, or the commit you run from source.
      placeholder: "For example: loopx 2.5.0 or a93a851d6"
    validations:
      required: true

  - type: dropdown
    id: entry-point
    attributes:
      label: Where it happens
      options:
        - Dashboard (web)
        - Telegram channel
        - Lark channel
        - CLI (loopx serve, loopx version)
        - Installation (install.sh)
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Start `loopx serve` ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the relevant error or server log lines after removing private details.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, PostgreSQL version and Claude CLI version, as far as relevant.
